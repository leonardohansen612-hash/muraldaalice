<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle • Mural da Alice</title><link rel="stylesheet" href="/css/base.css"><style>.wrap{padding:24px;max-width:1250px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.head h1{margin:5px 0 0;font-size:38px}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login .card{padding:26px;width:min(420px,100%)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{overflow:hidden}.thumb{aspect-ratio:4/3;background:rgba(255,255,255,.06);display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.body h3{margin:0 0 6px}.body p{min-height:42px;opacity:.8}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{padding:10px 12px;border-radius:12px;font-size:13px}.status{font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.pending{color:#ffd76a}.approved{color:#b7ff17}.rejected{color:#ff8fa8}.cloud{margin-left:8px}.count{opacity:.7;font-size:13px;margin-top:4px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><div class="bg"></div><section id="login" class="shell login"><div class="card"><div class="chip">💗 Mural da Alice</div><h1>Painel Admin</h1><p class="muted">Digite o PIN para controlar as publicações do mural.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button id="enter" class="btn" style="width:100%;margin-top:12px">Entrar</button></div></section><main id="app" class="shell wrap hidden"><header class="head"><div><div class="chip">CONTROLE DO MURAL <span id="mode" class="cloud"></span></div><h1>Mural da Alice</h1><div id="count" class="count"></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a href="/wall/" target="_blank" class="btn secondary">📺 Abrir telão</a><a href="/post/" target="_blank" class="btn ghost">📱 Abrir envio</a></div></header><section id="grid" class="grid"></section></main><div id="toast" class="toast"></div><script src="/config.js"></script><script type="module">
import { MuralStore } from '/js/store.js';
const login=document.querySelector('#login'),app=document.querySelector('#app'),grid=document.querySelector('#grid');
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function unlock(){login.classList.add('hidden');app.classList.remove('hidden');document.querySelector('#mode').textContent='☁️ Firebase';render()}
document.querySelector('#enter').onclick=()=>document.querySelector('#pin').value===MURAL_CONFIG.ADMIN_PIN?unlock():toast('PIN incorreto');document.querySelector('#pin').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#enter').click()};
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function render(){try{const posts=await MuralStore.listAll();const visible=posts.filter(p=>p.status==='approved').length;document.querySelector('#count').textContent=`${visible} no mural • ${posts.length} no total`;if(!posts.length){grid.innerHTML='<div class="card" style="padding:28px;grid-column:1/-1">Nenhuma publicação ainda.</div>';return}grid.innerHTML=posts.map(p=>`<article class="card item"><div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}">`:'<span style="font-size:42px">💬</span>'}</div><div class="body"><span class="status ${esc(p.status)}">${esc(p.status)}</span><h3>${esc(p.name||'Anônimo')}</h3><p>${esc(p.message||'Sem mensagem')}</p><div class="actions"><button class="btn" data-id="${p.id}" data-action="approved">✓ Exibir</button><button class="btn pink" data-id="${p.id}" data-action="rejected">◉ Ocultar</button><button class="btn ghost" data-id="${p.id}" data-action="delete">🗑 Excluir</button></div></div></article>`).join('');}catch(err){console.error(err);toast('Erro ao carregar o Firebase');}}
grid.addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const {id,action}=b.dataset;b.disabled=true;try{if(action==='delete'){if(!confirm('Excluir esta publicação?'))return;await MuralStore.remove(id)}else await MuralStore.setStatus(id,action);await render()}catch(err){console.error(err);toast('Não consegui atualizar')}finally{b.disabled=false}});
MuralStore.subscribe(()=>{if(!app.classList.contains('hidden'))render()});
</script></body></html>
