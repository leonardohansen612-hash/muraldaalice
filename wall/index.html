<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telão • Mural da Mari</title>
<link rel="stylesheet" href="/css/base.css">
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>
body{overflow:hidden;background:#390b27}
.wall{height:100vh;padding:22px 28px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:16px;isolation:isolate}
.wall:before{content:"";position:fixed;inset:0;z-index:-2;background:
radial-gradient(circle at 13% 22%,rgba(255,79,154,.38),transparent 27%),
radial-gradient(circle at 78% 18%,rgba(111,45,189,.22),transparent 24%),
radial-gradient(circle at 54% 92%,rgba(255,155,198,.20),transparent 31%),
linear-gradient(135deg,#300720 0%,#771647 48%,#430d2e 100%)}
.wall:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.25;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,black,transparent 72%)}

.head{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 4px}
.headLeft{display:flex;align-items:center;gap:18px;min-width:0}
.liveLogo{height:74px;width:auto;max-width:190px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(0,0,0,.36))}
.titleWrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.titleLine{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{font-family:Georgia,serif;margin:0;font-size:clamp(30px,3.35vw,54px);line-height:.95;letter-spacing:-2.5px;text-transform:uppercase}
.tagline{font-size:clamp(13px,1.1vw,18px);font-weight:800;color:var(--cream);opacity:.78;letter-spacing:.02em}
.live{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.075);font-weight:900;font-size:13px;letter-spacing:.08em;backdrop-filter:blur(12px)}
.liveDot{width:9px;height:9px;border-radius:50%;background:#ff304b;box-shadow:0 0 0 5px rgba(255,48,75,.12),0 0 18px rgba(255,48,75,.8);animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}
.hash{font-size:15px;font-weight:900;color:var(--cream);padding:10px 14px;border-radius:999px;border:1px solid rgba(241,227,200,.14);background:rgba(241,227,200,.06);white-space:nowrap}

.stage{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px}
.feedPanel{position:relative;min-height:0;padding:16px;border:1px solid rgba(255,255,255,.11);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 28px 80px rgba(0,0,0,.25);overflow:hidden}
.feedPanel:before{content:"";position:absolute;inset:-80px auto auto -80px;width:220px;height:220px;border:2px dashed rgba(255,79,154,.22);border-radius:50%;transform:rotate(14deg);pointer-events:none}
.feed{height:100%;min-height:0;position:relative;z-index:1;overflow:hidden;border-radius:22px;background:#4c1032}
.slide{position:absolute;inset:0;opacity:0;transform:scale(1.025);transition:opacity .75s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);pointer-events:none;overflow:hidden;background:#3d0b29}
.slide.active{opacity:1;transform:scale(1);pointer-events:auto}
.slideMedia{position:absolute;inset:0;overflow:hidden;background:#390b27}
.slideBg{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:blur(28px) brightness(.44) saturate(1.15);transform:scale(1.08);opacity:.82}
.slide img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;z-index:1;filter:drop-shadow(0 8px 28px rgba(0,0,0,.42))}
.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,2,12,.04) 42%,rgba(5,2,12,.92) 100%);pointer-events:none}
.slideInfo{position:absolute;z-index:3;left:28px;right:28px;bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.slideCopy{min-width:0;max-width:76%;text-shadow:0 3px 16px rgba(0,0,0,.65)}
.slideCopy b{display:block;font-size:clamp(28px,3vw,50px);line-height:.96;letter-spacing:-1.8px}
.slideCopy p{margin:8px 0 0;font-size:clamp(16px,1.6vw,25px);line-height:1.13;color:rgba(255,255,255,.88)}
.slideBadge{flex:none;padding:8px 11px;border-radius:999px;background:rgba(12,6,29,.68);border:1px solid rgba(255,255,255,.17);backdrop-filter:blur(12px);font-size:12px;font-weight:950;letter-spacing:.06em}
.slide.noimg{display:grid;place-items:center;padding:50px;background:radial-gradient(circle at 25% 20%,rgba(255,79,154,.38),transparent 35%),radial-gradient(circle at 82% 75%,rgba(111,45,189,.23),transparent 28%),linear-gradient(145deg,#7a184b,#350a24)}
.slide.noimg:after{display:none}.slide.noimg .quote{max-width:85%;text-align:center;font-size:clamp(36px,5vw,80px);font-weight:950;line-height:.98;letter-spacing:-.045em}.slide.noimg .quote small{display:block;margin-top:22px;font-size:clamp(16px,1.6vw,24px);letter-spacing:0;opacity:.68}
.progressRail{position:absolute;left:22px;right:22px;top:18px;z-index:6;height:4px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.progressBar{height:100%;width:0;background:linear-gradient(90deg,#ff4f9a,#ffd1e3);border-radius:99px}.progressBar.run{animation:slideProgress var(--slide-ms,8000ms) linear forwards}@keyframes slideProgress{from{width:0}to{width:100%}}
.counter{position:absolute;z-index:6;right:22px;top:32px;padding:7px 10px;border-radius:999px;background:rgba(10,5,22,.58);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);font-size:12px;font-weight:900;color:rgba(255,255,255,.8)}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(145deg,rgba(185,109,40,.10),rgba(255,255,255,.03));border:1px dashed rgba(255,255,255,.12);border-radius:22px}.empty h2{font-size:40px;margin:0}.empty p{font-size:19px;opacity:.7}
.side{min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:1px solid rgba(255,255,255,.10);border-radius:30px;background:linear-gradient(180deg,rgba(255,79,154,.18),rgba(255,255,255,.045));overflow:hidden}
.side:before{content:"";position:absolute;left:-80px;top:12%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,154,.28),transparent 68%);filter:blur(5px)}
.side:after{content:"✦";position:absolute;right:20px;top:18px;font-size:38px;opacity:.14;transform:rotate(12deg)}
.photoCall{position:absolute;top:18px;left:20px;right:auto;width:54%;text-align:left;z-index:5}.photoCall .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:950;color:var(--cream);opacity:.72}.photoCall strong{font-family:Georgia,serif;display:block;margin-top:6px;font-size:clamp(17px,1.25vw,21px);line-height:1.02;letter-spacing:-.65px;text-transform:uppercase;max-width:100%}.photoCall strong em{font-style:normal;color:#ff9bc6}
.mascotBox{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.mascot{position:absolute;right:-3%;bottom:-2%;width:62%;height:88%;max-height:88%;object-fit:contain;object-position:right bottom;aspect-ratio:auto;mix-blend-mode:normal;border-radius:0;border:0;box-shadow:none;filter:drop-shadow(0 18px 28px rgba(0,0,0,.42));transform-origin:50% 100%;transition:.18s transform}.mascotBox.celebrate .mascot{animation:photoBop 1.25s cubic-bezier(.22,.8,.2,1)}@keyframes photoBop{0%{transform:translateY(0) scale(1)}24%{transform:translateY(-30px) scale(1.045) rotate(-2deg)}48%{transform:translateY(-4px) scale(.99)}70%{transform:translateY(-16px) scale(1.025) rotate(1.5deg)}100%{transform:none}}
.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:10}.mascotBox.celebrate .flash{animation:flash .45s ease-out}@keyframes flash{0%{opacity:0}12%{opacity:.92}38%{opacity:.18}100%{opacity:0}}

.footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:118px;padding:10px 14px 10px 18px;border:1px solid rgba(255,255,255,.10);border-radius:24px;background:rgba(255,255,255,.055);backdrop-filter:blur(14px)}
.footerCopy{display:flex;align-items:center;gap:12px}.footerIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#b96d28,#ff9bc6);font-size:20px;box-shadow:0 10px 26px rgba(255,79,154,.28)}.footerCopy b{display:block;font-size:17px}.footerCopy span{display:block;font-size:12px;opacity:.66;margin-top:2px}.footerHash{text-align:center;font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--cream);opacity:.75}
.qrWrap{justify-self:end;display:flex;align-items:center;gap:14px}.qrCopy{text-align:right}.qrCopy b{display:block;font-size:17px}.qrCopy span{display:block;font-size:12px;opacity:.68;margin-top:3px}.qrMini{background:#fff;padding:9px;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.28),0 0 0 2px rgba(255,255,255,.14)}.qrMini canvas{display:block;width:96px!important;height:96px!important}

.spotlight{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:5vh 7vw;background:rgba(5,2,12,.82);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:.28s opacity}.spotlight.show{opacity:1;pointer-events:auto}.spotCard{width:min(1120px,92vw);height:min(720px,82vh);display:grid;grid-template-columns:1.25fr .75fr;border-radius:34px;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:#3d0b29;box-shadow:0 42px 140px rgba(0,0,0,.68),0 0 0 1px rgba(255,79,154,.18)}
.spotMedia{position:relative;min-height:0;background:linear-gradient(145deg,#711746,#3b0b29);overflow:hidden}.spotMedia .spotBg{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:blur(30px) brightness(.42) saturate(1.15);transform:scale(1.08);opacity:.86}.spotMedia .spotPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;filter:drop-shadow(0 10px 32px rgba(0,0,0,.45))}.spotNoimg{height:100%;display:grid;place-items:center;padding:44px;text-align:center;font-size:clamp(34px,4vw,64px);font-weight:950;line-height:1;letter-spacing:-.04em}.spotInfo{position:relative;padding:42px 38px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 80% 10%,rgba(255,79,154,.25),transparent 36%),linear-gradient(160deg,#5c103c,#2f071f)}.spotBadge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:8px 11px;border-radius:999px;background:rgba(255,79,154,.20);border:1px solid rgba(255,79,154,.40);font-size:12px;font-weight:950;letter-spacing:.08em}.spotInfo h2{font-size:clamp(32px,3.7vw,58px);line-height:.96;letter-spacing:-2px;margin:22px 0 12px}.spotInfo p{font-size:clamp(18px,1.8vw,28px);line-height:1.12;margin:0;color:rgba(255,255,255,.82)}.spotBrand{position:absolute;bottom:28px;left:38px;right:38px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;font-weight:900;color:var(--cream);opacity:.62}.spotBrand img{height:38px;width:auto}.cameraFlash{position:fixed;inset:0;z-index:90;background:#fff;opacity:0;pointer-events:none}.cameraFlash.go{animation:bigFlash .55s ease-out}@keyframes bigFlash{0%{opacity:0}10%{opacity:1}26%{opacity:.22}100%{opacity:0}}

.burst{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}.confetti{position:absolute;top:48%;left:80%;font-size:26px;animation:pop 1.2s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}

@media(max-width:1200px){.stage{grid-template-columns:1fr 270px}.feed{grid-template-columns:repeat(2,1fr)}.liveLogo{height:62px}.side .photoCall strong{font-size:18px}.spotCard{grid-template-columns:1.1fr .9fr}}
</style>
</head>
<body>
<div id="burst" class="burst"></div><div id="cameraFlash" class="cameraFlash"></div>
<div id="spotlight" class="spotlight"><div id="spotCard" class="spotCard"></div></div>
<main class="shell wall">
<header class="head">
  <div class="headLeft">
    <img class="liveLogo" src="/assets/logo-texpub-oficial.png" alt="Tex Pub">
    <div class="titleWrap">
      <div class="titleLine"><h1>Mural da Mari</h1><span class="live"><span class="liveDot"></span>AO VIVO</span></div>
      <div class="tagline">Momentos especiais para celebrar a Mari. 💗</div>
    </div>
  </div>
  <div class="hash" id="hash"></div>
</header>
<section class="stage">
  <div class="feedPanel"><div id="feed" class="feed"></div></div>
  <aside class="side">
    <div class="photoCall"><span class="eyebrow">Mari</span><strong>Boas companhias, <em>bons drinks e grandes histórias.</em></strong></div>
    <div id="mascotBox" class="mascotBox"><div class="flash"></div><img class="mascot" src="/assets/mari-funko.png?v=tvfix3" alt="Mari"></div>
  </aside>
</section>
<footer class="footer">
  <div class="footerCopy"><div class="footerIcon">📱</div><div><b>Quer aparecer no mural?</b><span>Envie sua foto e compartilhe seu momento no telão.</span></div></div>
  <div class="footerHash">#MURALDAMARI • #MARI</div>
  <div class="qrWrap"><div class="qrCopy"><b>Escaneie e apareça!</b><span>Abra a câmera do celular</span></div><div class="qrMini"><canvas id="qr"></canvas></div></div>
</footer>
</main>
<script src="/config.js"></script>
<script type="module">
import { MuralStore } from '/js/store.js';
const feed=document.querySelector('#feed'),box=document.querySelector('#mascotBox'),burst=document.querySelector('#burst'),spotlight=document.querySelector('#spotlight'),spotCard=document.querySelector('#spotCard'),cameraFlash=document.querySelector('#cameraFlash');
document.querySelector('#hash').textContent=MURAL_CONFIG.HASHTAG||'#MuralDaMari';
new QRious({element:document.querySelector('#qr'),value:location.origin+'/post/',size:280,level:'H'});
let lastIds=[];let initial=true;let spotlightTimer=null;
let carouselPosts=[];let carouselIndex=0;let carouselTimer=null;let pausedForSpotlight=false;
const SLIDE_MS=8000;
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function celebrate(){box.classList.remove('celebrate');void box.offsetWidth;box.classList.add('celebrate');setTimeout(()=>box.classList.remove('celebrate'),1450);burst.innerHTML='';const chars=['✦','●','★','◆','✧','•'];for(let i=0;i<22;i++){const s=document.createElement('span');s.className='confetti';s.textContent=chars[i%chars.length];s.style.setProperty('--x',`${(Math.random()*560-280).toFixed(0)}px`);s.style.setProperty('--y',`${(Math.random()*420-260).toFixed(0)}px`);s.style.setProperty('--r',`${Math.random()*720-360}deg`);s.style.color=['#ff4f9a','#ff8cba','#ffd1e3','#9d5ee7','#fff0f6'][i%5];s.style.animationDelay=`${Math.random()*.12}s`;burst.appendChild(s)}setTimeout(()=>burst.innerHTML='',1600)}
function restartProgress(){const bar=feed.querySelector('.progressBar');if(!bar)return;bar.classList.remove('run');void bar.offsetWidth;bar.style.setProperty('--slide-ms',`${SLIDE_MS}ms`);bar.classList.add('run')}
function drawCarousel(){
  clearTimeout(carouselTimer);
  if(!carouselPosts.length){feed.innerHTML='<div class="empty"><div><h2>👋 Compartilhe o primeiro momento!</h2><p>Escaneie o QR Code e mande sua foto para o Mural da Mari.</p></div></div>';return}
  if(carouselIndex>=carouselPosts.length)carouselIndex=0;
  const p=carouselPosts[carouselIndex];
  const total=carouselPosts.length;
  feed.innerHTML=`<div class="progressRail"><div class="progressBar"></div></div><div class="counter">${carouselIndex+1} / ${total}</div>`+
    (p.image_url?`<article class="slide active"><div class="slideMedia"><img class="slideBg" src="${esc(p.image_url)}" alt=""><img class="photo" src="${esc(p.image_url)}" alt="Publicação de ${esc(p.name||'Anônimo')}"></div><div class="slideInfo"><div class="slideCopy"><b>${esc(p.name||'Anônimo')}</b>${p.message?`<p>${esc(p.message)}</p>`:''}</div><div class="slideBadge">MURAL DA MARI</div></div></article>`:`<article class="slide noimg active"><div class="quote">“${esc(p.message||'Um momento especial!')}”<small>${esc(p.name||'Anônimo')}</small></div></article>`);
  restartProgress();
  if(total>1&&!pausedForSpotlight)carouselTimer=setTimeout(()=>{carouselIndex=(carouselIndex+1)%carouselPosts.length;drawCarousel()},SLIDE_MS)
}
function showSpotlight(p){if(!p)return;pausedForSpotlight=true;clearTimeout(carouselTimer);clearTimeout(spotlightTimer);cameraFlash.classList.remove('go');void cameraFlash.offsetWidth;cameraFlash.classList.add('go');const media=p.image_url?`<div class="spotMedia"><img class="spotBg" src="${esc(p.image_url)}" alt=""><img class="spotPhoto" src="${esc(p.image_url)}" alt="Publicação de ${esc(p.name||'Anônimo')}"></div>`:`<div class="spotMedia"><div class="spotNoimg">“${esc(p.message||'Um momento especial!')}”</div></div>`;spotCard.innerHTML=`${media}<div class="spotInfo"><span class="spotBadge">NOVA PUBLICAÇÃO NO MURAL</span><h2>${esc(p.name||'Anônimo')}</h2>${p.message&&p.image_url?`<p>${esc(p.message)}</p>`:''}<div class="spotBrand"><img src="/assets/logo-texpub-oficial.png" alt="Tex Pub"><span>#MuralDaMari</span></div></div>`;setTimeout(()=>spotlight.classList.add('show'),90);spotlightTimer=setTimeout(()=>{spotlight.classList.remove('show');pausedForSpotlight=false;const idx=carouselPosts.findIndex(x=>x.id===p.id);carouselIndex=idx>=0?idx:0;setTimeout(drawCarousel,300)},7600)}
spotlight.addEventListener('click',()=>{clearTimeout(spotlightTimer);spotlight.classList.remove('show');pausedForSpotlight=false;setTimeout(drawCarousel,250)});
async function render(isRealtime=false){try{const posts=await MuralStore.listApproved();const ids=posts.map(p=>p.id);const newIds=ids.filter(id=>!lastIds.includes(id));carouselPosts=posts;if(carouselIndex>=carouselPosts.length)carouselIndex=0;if(isRealtime&&!initial&&newIds.length){celebrate();const newest=posts.find(p=>newIds.includes(p.id));drawCarousel();showSpotlight(newest)}else if(!pausedForSpotlight){drawCarousel()}lastIds=ids;initial=false}catch(err){console.error(err);feed.innerHTML='<div class="empty"><div><h2>Sem publicações ainda</h2><p>Escaneie o QR Code e mande a primeira foto para a Mari.</p></div></div>'}}
await render(false);MuralStore.subscribe(()=>render(true));
</script>
</body>
</html>
