<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar • Mural da Noiva</title><link rel="stylesheet" href="/css/base.css"><style>.wrap{min-height:100vh;padding:24px;display:grid;place-items:center}.panel{width:min(620px,100%);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.top img{height:46px}.title{font-family:Georgia,serif;font-size:36px;margin:6px 0}.fields{display:grid;gap:14px}.preview{display:none;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#0c0719}.preview img{width:100%;height:100%;object-fit:cover}.notice{padding:12px 14px;border-radius:14px;background:rgba(243,231,203,.10);font-size:13px}.submit{width:100%;margin-top:4px;font-size:17px}.size{font-size:12px;opacity:.6;margin-top:5px}/* The Bride — mobile photo experience */
.panel{background:linear-gradient(155deg,rgba(114,19,68,.96),rgba(42,5,29,.97));border:1px solid rgba(255,174,208,.42);box-shadow:0 24px 80px rgba(0,0,0,.45),0 0 65px rgba(255,79,154,.12)}
.brideHero{display:grid;grid-template-columns:116px 1fr;align-items:center;gap:16px;padding:12px;margin-bottom:22px;border:1px solid rgba(255,209,227,.24);border-radius:22px;background:linear-gradient(120deg,rgba(255,79,154,.2),rgba(255,255,255,.04))}
.brideHero img{width:116px;height:142px;object-fit:cover;object-position:center 30%;border-radius:15px}
.brideHero b{display:block;font-family:Georgia,serif;font-size:30px;line-height:1;color:#fff0f6}.brideHero span{display:block;margin-top:9px;font-size:14px;line-height:1.4;color:#ffd1e3}
.submit{background:linear-gradient(100deg,#f52f8d,#ad155b);box-shadow:0 10px 28px rgba(255,79,154,.28)}
@media(max-width:420px){.brideHero{grid-template-columns:95px 1fr}.brideHero img{width:95px;height:126px}.brideHero b{font-size:24px}}
</style></head><body><div class="bg"></div><main class="shell wrap"><section class="card panel"><div class="top"><div><div class="chip">💗 Mural da Noiva</div><h1 class="title">Celebre com a noiva 💍</h1></div><img src="/assets/logo-texpub-oficial.png" alt="Tex Pub"></div><div class="brideHero"><img src="/assets/the-bride.jpg?v=bride20261016" alt="The Bride"><div><b>THE BRIDE ♡</b><span>Girls just wanna have fun! 💋<br>Compartilhe os melhores momentos dessa noite especial.</span></div></div><form id="form" class="fields"><div><label>Seu nome ou @</label><input id="name" maxlength="40" placeholder="Ex: @leo"></div><div><label>Foto</label><input id="file" type="file" accept="image/*"><div class="size">A foto é otimizada automaticamente antes de aparecer no telão.</div></div><div id="preview" class="preview"><img id="previewImg"></div><div><label>Mensagem</label><textarea id="message" maxlength="180" placeholder="Deixe um recado especial para a noiva 💗"></textarea></div><div class="notice">Sua publicação entra automaticamente no Mural da Noiva.</div><button id="send" class="btn submit" type="submit">Enviar para o mural</button></form></section></main><div id="toast" class="toast"></div><script src="/config.js?v=20260919-1825"></script><script type="module">
import { MuralStore } from '/js/store.js?v=20260919-1825';
const f=document.querySelector('#file'),p=document.querySelector('#preview'),pi=document.querySelector('#previewImg'),form=document.querySelector('#form'),btn=document.querySelector('#send');
f.onchange=()=>{const file=f.files[0];if(!file){p.style.display='none';return}pi.src=URL.createObjectURL(file);p.style.display='block'};
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent=f.files[0]?'Comprimindo e enviando…':'Enviando…';try{let image_url='';if(f.files[0])image_url=await MuralStore.uploadImage(f.files[0]);await MuralStore.create({name:document.querySelector('#name').value.trim(),message:document.querySelector('#message').value.trim(),image_url});form.reset();p.style.display='none';toast('Enviado! Sua foto já vai entrar no Mural da Noiva. 💗');}catch(err){console.error(err);toast(err?.message||'Não consegui enviar. Tente novamente.')}finally{btn.disabled=false;btn.textContent='Enviar para o mural'}};
</script></body></html>
