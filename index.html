<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mural da Mari</title><link rel="stylesheet" href="/css/base.css"><style>.home{min-height:100vh;display:grid;place-items:center;padding:28px}.hero{max-width:960px;width:100%;padding:36px;display:grid;grid-template-columns:1.2fr .8fr;gap:26px}.hero h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,82px);line-height:.92;margin:12px 0 18px;text-transform:uppercase}.hero h1 span{color:var(--cream)}.hero p{font-size:19px;max-width:620px;opacity:.82}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.mascot{display:flex;align-items:end;justify-content:center}.mascot img{width:min(390px,100%);max-height:560px;aspect-ratio:3/4;object-fit:cover;border-radius:28px;border:5px solid rgba(255,240,246,.9);box-shadow:0 26px 50px rgba(45,4,29,.4)}.live{margin-top:18px;font-size:13px;opacity:.8}@media(max-width:760px){.hero{grid-template-columns:1fr;padding:24px}.mascot{order:-1}.mascot img{width:220px}}</style></head><body><div class="bg"></div><main class="shell home"><section class="card hero"><div><div class="brand"><img src="/assets/logo-texpub-oficial.png" alt="Tex Pub"><span class="chip">💗 Mural da Mari</span></div><h1>Momentos<br><span>da Mari.</span></h1><p>Escaneie o QR, envie sua foto ou mensagem e apareça no Mural da Mari.</p><div class="links"><a class="btn" href="/post/">📱 Enviar publicação</a><a class="btn secondary" href="/wall/">📺 Abrir telão</a><a class="btn ghost" href="/admin/">⚙️ Admin</a></div><div class="live">☁️ Conectado ao Firebase Firestore</div></div><div class="mascot"><img src="/assets/mari-funko.png" alt="Mari"></div></section></main></body></html>
